<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Форма заявки с интеграцией amoCRM и Roistat">
    <title>Новая заявка</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <!-- Roistat Counter Start -->
    <script>
    (function(w, d, s, h, id) {
        w.roistatProjectId = id; w.roistatHost = h; w.roistatPage = d.location.href; w.roistatReferrer = d.referrer;
        var p = d.location.protocol == "https:" ? "https://" : "http://";
        var u = /^.*roistat_visit=[^;]+(.*)?$/.test(d.cookie) ? "/dist/module.js" : "/api/site/1.0/"+id+"/init?referrer="+encodeURIComponent(d.location.href);
        var js = d.createElement(s); js.charset="UTF-8"; js.async = 1; js.src = p+h+u; var js2 = d.getElementsByTagName(s)[0]; js2.parentNode.insertBefore(js, js2);
    })(window, document, 'script', 'cloud.roistat.com', 'd794f7d79243d06d51d53ab480e049a5');
    </script>
    <!-- Roistat Counter End -->

    <main class="page-shell">
        <section class="intro" aria-labelledby="page-title">
            <a class="brand" href="#" aria-label="На главную">
                <span class="brand-mark" aria-hidden="true">R</span>
                <span>Roistat Connect</span>
            </a>

            <div class="intro-copy">
                <p class="eyebrow">amoCRM × Roistat</p>
                <h1 id="page-title">Новая заявка — без лишних шагов.</h1>
                <p class="intro-text">
                    Оставьте телефон, и мы свяжемся с вами. Имя, почта и бюджет помогут подготовиться к разговору.
                </p>
            </div>

            <p class="privacy-note">
                <span class="privacy-icon" aria-hidden="true"></span>
                Данные передаются напрямую в CRM
            </p>
        </section>

        <section class="form-panel" aria-labelledby="form-title">
            <div class="form-heading">
                <p class="step-label">Заявка</p>
                <h2 id="form-title">Расскажите о себе</h2>
                <p>Обязательное поле отмечено звёздочкой.</p>
            </div>

            <form id="lead-form">
                <div class="field">
                    <label for="name">Имя</label>
                    <input
                        id="name"
                        name="name"
                        type="text"
                        maxlength="100"
                        autocomplete="name"
                        placeholder="Как к вам обращаться"
                    >
                </div>

                <div class="field">
                    <label for="email">Электронная почта</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        maxlength="254"
                        autocomplete="email"
                        placeholder="name@example.com"
                    >
                </div>

                <div class="field">
                    <label for="phone">Телефон <span aria-hidden="true">*</span></label>
                    <input
                        id="phone"
                        name="phone"
                        type="text"
                        inputmode="numeric"
                        maxlength="15"
                        autocomplete="tel"
                        aria-describedby="phone-hint phone-error"
                        aria-required="true"
                        placeholder="Только цифры"
                    >
                    <div class="field-meta">
                        <span id="phone-hint">От 5 до 15 цифр</span>
                        <span id="phone-counter" aria-hidden="true">0 / 15</span>
                    </div>
                    <p class="field-error" id="phone-error" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label for="price">Предполагаемый бюджет</label>
                    <div class="input-suffix">
                        <input
                            id="price"
                            name="price"
                            type="text"
                            inputmode="numeric"
                            maxlength="8"
                            placeholder="0"
                        >
                        <span aria-hidden="true">₽</span>
                    </div>
                </div>

                <button class="submit-button" type="submit">
                    <span>Отправить заявку</span>
                    <span class="button-arrow" aria-hidden="true">↗</span>
                </button>

                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>
